  <rect x="48" y="48" width="704" height="904" fill="none" stroke="#C59B27" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Corner Ornamentation -->
  <path d="M 40 60 L 60 40 M 760 60 L 740 40 M 40 940 L 60 960 M 760 940 L 740 960" stroke="#C59B27" stroke-width="1.5"/>

