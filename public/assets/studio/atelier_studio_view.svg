<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAtelier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="50%" stop-color="#F2ECE4"/>
      <stop offset="100%" stop-color="#E7DDD0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bgAtelier)"/>

  <!-- Matboard Double Framing -->
  <rect x="36" y="36" width="728" height="928" fill="none" stroke="#8C7867" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="48" y="48" width="704" height="904" fill="none" stroke="#C5A059" stroke-opacity="0.5" stroke-width="1"/>

  <!-- Corner details -->
  <path d="M 40 60 L 60 40 M 760 60 L 740 40 M 40 940 L 60 960 M 760 940 L 740 960" stroke="#C5A059" stroke-width="1.5"/>

  <!-- Center Emblem -->
  <circle cx="400" cy="360" r="115" fill="#FFFFFF" fill-opacity="0.8" stroke="#755717" stroke-width="2"/>
  <circle cx="400" cy="360" r="100" fill="none" stroke="#C5A059" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Studio / Draughtsman Motif -->
  <g transform="translate(400, 360)">
    <!-- Palette, brushes & easel -->
    <path d="M -30 20 C -45 20, -50 -15, -20 -35 C 10 -50, 45 -35, 45 0 C 45 25, 10 35, -5 20 Z" fill="#F8F2F0" stroke="#5C4D43" stroke-width="2"/>
    <circle cx="-15" cy="-10" r="5" fill="#C5A059"/>
    <circle cx="5" cy="-20" r="5" fill="#755717"/>
    <circle cx="25" cy="-5" r="5" fill="#5C4D43"/>
    <!-- Pencil & Quill crossing -->
    <line x1="-35" y1="40" x2="35" y2="-40" stroke="#6B5949" stroke-width="3"/>
    <polygon points="35,-40 27,-35 32,-30" fill="#1D1B1A"/>
  </g>

  <!-- Titles -->
  <text x="400" y="540" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="600" fill="#1D1B1A" letter-spacing="1">
    Atelier Demo
  </text>
  <text x="400" y="580" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#755717" letter-spacing="3" text-transform="uppercase">
    CRAFTED WITH CREATIVITY
  </text>

  <line x1="280" y1="620" x2="520" y2="620" stroke="#8C7867" stroke-opacity="0.3" stroke-width="1"/>

  <rect x="220" y="660" width="360" height="42" rx="4" fill="#FFFFFF" fill-opacity="0.85" stroke="#C5A059" stroke-width="1"/>
  <text x="400" y="686" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#1D1B1A" letter-spacing="2">
    FINE ART &amp; CREATIVE ATELIER
  </text>

  <text x="400" y="880" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="16" fill="#8C7867" font-style="italic">
    Demonstration Portfolio · Open-Source Showcase
  </text>
  <text x="400" y="905" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#80756D" letter-spacing="2">
    HANDMADE ARTWORK &amp; BESPOKE GIFTS
  </text>
</svg>
